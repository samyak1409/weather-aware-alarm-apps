name: core
description: Shared logic for Arunoday and Nivaat - solar math, sleep planning, wind engine, Open-Meteo client, theme.
version: 0.1.0
publish_to: none

environment:
  # >=3.10.0 because `sqlite3` 3.x compiles its native library through Dart
  # build hooks, which need that SDK. Both apps are already on ^3.12.2.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  alarm: ^5.10.0
  audioplayers: ^6.8.1
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_alarmkit: ^0.3.1
  geolocator: ^14.0.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  # `sqlite3` 3.x bundles the native library itself — do NOT add
  # `sqlite3_flutter_libs`, which is `0.6.0+eol` and, from that version, does
  # nothing at all.
  sqlite3: ^3.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  # build_runner must stay below 2.15.2: from there it wants analyzer >=13.3.0,
  # which wants meta ^1.18.3, and flutter_test from the SDK pins meta to 1.18.0.
  # Raising it fails version solving outright rather than degrading.
  build_runner: ">=2.4.0 <2.15.2"
  drift_dev: ^2.34.5
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0"

flutter:
